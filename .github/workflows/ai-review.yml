name: AI Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ai-review-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  review:
    name: AI Code Review
    if: >
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      (github.event.action != 'labeled' || github.event.label.name == 'ai-cr:review')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Write PR diff
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          git fetch origin "$BASE_REF"
          diff_file="${GITHUB_WORKSPACE}/pr.diff"
          max_bytes=204800
          tmp="$(mktemp)"
          # pipefail off: git may SIGPIPE (141) when head closes after the cap.
          set +o pipefail
          git diff "origin/${BASE_REF}...HEAD" -- . \
            ':(exclude)package-lock.json' \
            ':(exclude)packages/code-reviewer/package-lock.json' \
            | head -c $((max_bytes + 1)) > "$tmp"
          set -o pipefail
          size="$(wc -c < "$tmp" | tr -d ' ')"
          if (( size > max_bytes )); then
            {
              echo "# DIFF TRUNCATED to ${max_bytes} bytes for the reviewer prompt"
              head -c "$max_bytes" "$tmp"
            } > "$diff_file"
          else
            mv "$tmp" "$diff_file"
            tmp=""
          fi
          [[ -n "$tmp" && -f "$tmp" ]] && rm -f "$tmp"
          echo "diff_bytes=$(wc -c < "$diff_file" | tr -d ' ')" >> "$GITHUB_OUTPUT"
        id: diff

      - name: Skip empty diff
        id: skip
        run: |
          set -euo pipefail
          if [[ ! -s "${GITHUB_WORKSPACE}/pr.diff" ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Post empty-diff comment
        if: steps.skip.outputs.skip == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          printf '%s\n' \
            '<!-- ai-cr:review -->' \
            'No reviewable diff (empty or lockfile-only). Skipped the model.' \
            '<!-- ai-cr:review -->' \
            > "${GITHUB_WORKSPACE}/ai-review-comment.md"
          bash "${GITHUB_WORKSPACE}/.github/actions/ai-reviewer/upsert-comment.sh"

      - name: Review diff
        if: steps.skip.outputs.skip != 'true'
        id: review
        uses: ./.github/actions/ai-reviewer
        with:
          api-key: ${{ secrets.CURSOR_API_KEY }}
          pr-title: ${{ github.event.pull_request.title }}
          diff-path: ${{ github.workspace }}/pr.diff

      - name: Comment and label
        if: steps.skip.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          VERDICT: ${{ steps.review.outputs.verdict }}
        run: |
          set -euo pipefail
          jq -r '
            "<!-- ai-cr:review -->\n" +
            "## AI Code Review\n\n" +
            "**Verdict:** `" + .verdict + "`\n\n" +
            "| Criterion | Score |\n| --- | ---: |\n" +
            "| Implementation correctness | \(.implementationCorrectness) |\n" +
            "| Idiomaticity | \(.idiomaticity) |\n" +
            "| Complexity | \(.complexity) |\n" +
            "| Test / risk coverage | \(.testRiskCoverage) |\n" +
            "| Documentation | \(.documentation) |\n" +
            "| Security and safety | \(.securitySafety) |\n\n" +
            .summary +
            "\n\n<!-- ai-cr:review -->\n"
          ' "${GITHUB_WORKSPACE}/ai-review.json" > "${GITHUB_WORKSPACE}/ai-review-comment.md"
          bash "${GITHUB_WORKSPACE}/.github/actions/ai-reviewer/upsert-comment.sh"

          gh label create "ai-cr:passed" --color "0E8A16" --description "AI code review passed" || true
          gh label create "ai-cr:failed" --color "B60205" --description "AI code review failed" || true
          gh label create "ai-cr:review" --color "FBCA04" --description "Retry AI code review" || true

          if [[ "$VERDICT" == "pass" ]]; then
            gh pr edit "$PR_NUMBER" --add-label "ai-cr:passed" || true
            gh pr edit "$PR_NUMBER" --remove-label "ai-cr:failed" || true
          else
            gh pr edit "$PR_NUMBER" --add-label "ai-cr:failed" || true
            gh pr edit "$PR_NUMBER" --remove-label "ai-cr:passed" || true
          fi
          gh pr edit "$PR_NUMBER" --remove-label "ai-cr:review" || true
